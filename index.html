<body>
<div class="app">
<aside class="sidebar">

</main></div>
<div class="modalback" id="modalback"><div class="modal"><div class="modalhead"><h3 id="modalTitle">Create record</h3><button class="close" onclick="closeModal()">×</button></div><div class="modalbody" id="modalBody"></div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="modalSave">Save record</button></div></div></div>

<script>
const facilities=[
{id:"CF-001",name:"Central Market Public Toilet",type:"Public Toilet",zone:"Central Zone",address:"Market Road, Ward 12",operator:"CleanCity Services",status:"Operational",uptime:97.8,score:91,capacity:"High",last:"09:10 AM",risk:"Normal"},
{id:"CF-002",name:"Lakeview Drinking Water Point",type:"Drinking Water",zone:"East Zone",address:"Lakeview Junction, Ward 08",operator:"AquaCare Operations",status:"Attention",uptime:89.2,score:74,capacity:"Medium",last:"08:45 AM",risk:"Water pressure low"},
{id:"CF-003",name:"Ward 14 Community Hall",type:"Community Hall",zone:"North Zone",address:"North Street, Ward 14",operator:"Municipal Team",status:"Operational",uptime:99.1,score:96,capacity:"250 persons",last:"Yesterday",risk:"Normal"},
{id:"CF-004",name:"Riverside Public Toilet",type:"Public Toilet",zone:"South Zone",address:"Riverside Bus Stop, Ward 21",operator:"CleanCity Services",status:"Under Maintenance",uptime:82.4,score:61,capacity:"Medium",last:"07:30 AM",risk:"Pump failure"},
{id:"CF-005",name:"People's Park Amenities",type:"Public Park",zone:"West Zone",address:"People's Park, Ward 05",operator:"GreenTown Facilities",status:"Operational",uptime:95.6,score:88,capacity:"Large",last:"08:20 AM",risk:"Normal"},
{id:"CF-006",name:"Bus Terminal Water Kiosk",type:"Drinking Water",zone:"Central Zone",address:"Main Bus Terminal, Ward 02",operator:"AquaCare Operations",status:"Operational",uptime:98.6,score:93,capacity:"High",last:"09:25 AM",risk:"Normal"}
];
let tasks=[
{id:"TSK-1042",facility:"CF-001",service:"Scheduled cleaning",assignee:"R. Kumar",due:"10:00 AM",status:"Completed",evidence:"2 photos",verified:true},
{id:"TSK-1043",facility:"CF-002",service:"Water quality & pressure check",assignee:"S. Anand",due:"10:30 AM",status:"In Progress",evidence:"Pending",verified:false},
{id:"TSK-1044",facility:"CF-004",service:"Pump corrective maintenance",assignee:"M. Prakash",due:"11:00 AM",status:"Overdue",evidence:"1 photo",verified:false},
{id:"TSK-1045",facility:"CF-005",service:"Park amenities inspection",assignee:"L. Devi",due:"11:30 AM",status:"Pending",evidence:"Pending",verified:false},
{id:"TSK-1046",facility:"CF-003",service:"Pre-booking hall inspection",assignee:"A. Joseph",due:"12:00 PM",status:"Pending",evidence:"Pending",verified:false}
];
let complaints=[
{id:"CMP-2081",facility:"CF-002",issue:"Low water pressure",priority:"High",status:"Assigned",time:"09:02 AM"},
{id:"CMP-2082",facility:"CF-004",issue:"Toilet pump not working",priority:"Critical",status:"In Progress",time:"08:15 AM"},
{id:"CMP-2083",facility:"CF-001",issue:"Soap dispenser empty",priority:"Medium",status:"Open",time:"09:38 AM"}
];
let inspections=[
{id:"IN-510",facility:"CF-001",inspector:"P. Meena",score:91,result:"Pass",date:"Today 09:20"},
{id:"IN-511",facility:"CF-002",inspector:"P. Meena",score:74,result:"Conditional",date:"Today 08:50"},
{id:"IN-512",facility:"CF-004",inspector:"V. Raj",score:61,result:"Fail",date:"Today 08:00"}
];
let current="overview";
const $=s=>document.querySelector(s);
const facilityName=id=>facilities.find(f=>f.id===id)?.name||id;
const badge=(s)=>{let c=["Completed","Operational","Pass","Verified","Approved","Paid"].includes(s)?"good":["Pending","In Progress","Attention","Conditional","Assigned"].includes(s)?"warn":["Overdue","Fail","Critical","Under Maintenance","Rejected"].includes(s)?"bad":"info";return `<span class="status ${c}"><i class="dot"></i>${s}</span>`};
function toast(m){let t=$("#toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2600)}
function go(p){current=p;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));$("#crumb").textContent=({overview:"Overview",facilities:"Facility registry",schedules:"Service schedules",workorders:"Work orders",field:"Field execution",inspections:"Quality inspections",contracts:"Contracts & SLA",payments:"Payment certification",inventory:"Inventory",feedback:"Public feedback",ai:"AI intelligence",reports:"Reports & analytics"})[p];render()}
$("#nav").addEventListener("click",e=>{let b=e.target.closest("button[data-page]");if(b)go(b.dataset.page)});
function head(title,desc,actions=""){return `<div class="pagehead"><div><div class="eyebrow">CIVIC OPERATIONS CONTROL</div><h1>${title}</h1><div class="sub">${desc}</div></div><div class="actions">${actions}</div></div>`}
function btn(label,fn,cls=""){return `<button class="btn ${cls}" onclick="${fn}">${label}</button>`}
function kpi(label,num,foot,delta=""){return `<div class="card kpi"><div class="kpi-top"><span>${label}</span><span>↗</span></div><div class="kpi-num">${num}</div><div class="kpi-foot">${delta?`<span class="delta">${delta}</span> · `:""}${foot}</div></div>`}
function render(){let c=$("#content");const pages={overview:overview,facilities:facilityPage,schedules:schedulePage,workorders:workPage,field:fieldPage,inspections:inspectionPage,contracts:contractPage,payments:paymentPage,inventory:inventoryPage,feedback:feedbackPage,ai:aiPage,reports:reportPage};c.innerHTML=pages[current]()}
function overview(){return head("Public service overview","Live operational picture across facilities, contractors and service commitments.",btn("＋ Register facility","openFacility()","primary")+btn("＋ Create work order","openWork()"))+
`<div class="grid kpis">${kpi("Registered facilities","248","Across 6 operational zones","12 added this month")}${kpi("Available / operational","231","93.1% current availability","2.4% vs last month")}${kpi("Open service issues","17","4 require immediate attention")}${kpi("Estimated SLA compliance","94.6%","Current contract period","1.8% vs last period")}</div>
<div class="grid dashboardgrid">
<div class="card panel"><div class="panelhead"><h3>Facility service health by category</h3><span class="smalltext">Today's snapshot</span></div>
${bar("Public toilets",92,100)}${bar("Drinking water points",86,100)}${bar("Community facilities",97,100)}${bar("Parks & amenities",94,100)}
<div class="notice">Service health combines availability, schedule completion and latest verified inspection. It is an operational indicator, not a payment approval.</div></div>
<div class="card panel"><div class="panelhead"><h3>Attention required</h3><span class="status bad">4 critical / high</span></div>
${feed("⚠","Pump failure – Riverside Public Toilet","CF-004 · Corrective work order overdue · 08:15 AM")}${feed("◉","Low water pressure – Lakeview Point","CF-002 · Water service alert · 09:02 AM")}${feed("▣","Inspection score below threshold","CF-004 · Score 61/100 · Re-inspection required")}${feed("₹","Contract evidence pending","CleanCity Services · 3 service records awaiting review")}</div></div>
<div class="card panel"><div class="panelhead"><h3>Today's service execution</h3><a class="smalltext" href="#" onclick="go('field');return false">Open field execution →</a></div>${taskTable(tasks.slice(0,5))}</div>
<div class="grid twocol section"><div class="card panel"><div class="panelhead"><h3>Facility status</h3><span class="smalltext">Sample locations</span></div>${facilityCards(facilities.slice(0,3))}</div><div class="card panel"><div class="panelhead"><h3>Operational control reminders</h3></div>${feed("✓","Verify completed field tasks","Evidence and supervisor review are required before SLA credit.")}${feed("◷","Review overdue corrective jobs","Escalate unresolved safety and water availability issues.")}${feed("₹","Certify contractor services","Only approved service lines should flow into the payment register.")}</div></div>`}
function bar(n,v,max){return `<div class="barrow"><span>${n}</span><div class="bar"><i style="width:${v/max*100}%"></i></div><b>${v}%</b></div>`}
function feed(i,t,d){return `<div class="feed"><div class="feedicon">${i}</div><div><b>${t}</b><p>${d}</p></div></div>`}
function taskTable(rows){return `<div class="tablewrap"><table><thead><tr><th>Task ID</th><th>Facility</th><th>Service</th><th>Assignee</th><th>Due</th><th>Status</th><th>Evidence</th><th></th></tr></thead><tbody>${rows.map(t=>`<tr><td><b>${t.id}</b></td><td>${facilityName(t.facility)}</td><td>${t.service}</td><td>${t.assignee}</td><td>${t.due}</td><td>${badge(t.status)}</td><td>${t.evidence}</td><td><button class="btn small" onclick="taskAction('${t.id}')">Open</button></td></tr>`).join("")}</tbody></table></div>`}
function facilityCards(rows){return `<div class="grid">${rows.map(f=>`<div class="facilitycard"><div class="facilitytop"><span class="smalltext">${f.id} · ${f.type}</span>${badge(f.status)}</div><h4>${f.name}</h4><p>${f.zone} · ${f.operator}</p><div class="progress"><span style="width:${f.score}%"></span></div><div class="facilitymeta"><span>Quality <b>${f.score}/100</b></span><span>Uptime <b>${f.uptime}%</b></span><span>${f.last}</span></div></div>`).join("")}</div>`}
function facilityPage(){return head("Facility registry","A single asset register for public facilities, service points and their operating responsibilities.",btn("＋ Register facility","openFacility()","primary"))+
`<div class="filters"><input class="search" id="facilitySearch" placeholder="Search facility, ID, zone or operator..." oninput="filterFacilities()"><select id="facilityType" onchange="filterFacilities()"><option value="">All facility types</option><option>Public Toilet</option><option>Drinking Water</option><option>Community Hall</option><option>Public Park</option></select><select id="facilityStatus" onchange="filterFacilities()"><option value="">All statuses</option><option>Operational</option><option>Attention</option><option>Under Maintenance</option></select></div>
<div class="grid threecol" id="facilityGrid">${facilities.map(f=>facilityTile(f)).join("")}</div>`}
function facilityTile(f){return `<div class="card facilitycard"><div class="facilitytop"><span class="smalltext">${f.id} · ${f.type}</span>${badge(f.status)}</div><h4>${f.name}</h4><p>${f.address}</p><p>${f.zone} · ${f.operator}</p><div class="progress"><span style="width:${f.score}%"></span></div><div class="facilitymeta"><span>Quality <b>${f.score}</b></span><span>Uptime <b>${f.uptime}%</b></span></div><div style="display:flex;gap:7px;margin-top:12px"><button class="btn small" onclick="facilityDetail('${f.id}')">View profile</button><button class="btn small" onclick="openWork('${f.id}')">Create work order</button></div></div>`}
function filterFacilities(){let q=$("#facilitySearch").value.toLowerCase(),t=$("#facilityType").value,s=$("#facilityStatus").value;let rows=facilities.filter(f=>(!q||Object.values(f).join(" ").toLowerCase().includes(q))&&(!t||f.type===t)&&(!s||f.status===s));$("#facilityGrid").innerHTML=rows.length?rows.map(f=>facilityTile(f)).join(""):`<div class="empty">No facilities match the selected filters.</div>`}
function schedulePage(){return head("Service schedules","Configure recurring obligations and generate work based on facility type, risk and operating hours.",btn("＋ New schedule","openSchedule()","primary"))+
`<div class="grid kpis">${kpi("Active schedules","684","Across all facility categories")}${kpi("Tasks due today","1,248","Generated from approved schedules")}${kpi("Completed on time","91.8%","Current day")}${kpi("Missed service windows","23","Requires supervisor review")}</div>

function workAction(id){let x=complaints.find(x=>x.id===id);openModal("Manage issue · "+id,`<div class="notice"><b>${x.issue}</b><br>${facilityName(x.facility)} · ${x.priority} priority</div><div class="formgrid">${sel("Status","status",["Open","Assigned","In Progress","Resolved","Closed"])}${sel("Priority","priority",["Low","Medium","High","Critical"])}${f("Assigned team","team","Team / technician")}${f("Resolution note","note","Action taken")}</div>`,()=>{x.status=val("status");x.priority=val("priority");closeModal();render();toast("Issue updated")})}
function facilityDetail(id){let f=facilities.find(x=>x.id===id);openModal(f.name,`<div class="grid twocol"><div class="airesult"><span class="smalltext">FACILITY ID</span><h4>${f.id}</h4>${badge(f.status)}</div><div class="airesult"><span class="smalltext">QUALITY SCORE</span><div class="score">${f.score}/100</div></div><div class="airesult"><span class="smalltext">AVAILABILITY</span><h4>${f.uptime}%</h4></div><div class="airesult"><span class="smalltext">OPERATOR</span><h4>${f.operator}</h4></div></div><p class="smalltext">${f.address} · ${f.zone}</p><div class="notice">Profile tabs in production: asset details, utilities, service history, inspection history, complaints, documents, contract coverage, cost ledger and audit trail.</div>`,()=>closeModal())}
function inspectionDetail(id){let i=inspections.find(x=>x.id===id);openModal("Inspection review · "+id,`<div class="airesult"><div class="score">${i.score}/100</div>${badge(i.result)}<p>${facilityName(i.facility)} · ${i.inspector} · ${i.date}</p></div><div class="notice">Review checklist responses, evidence, defect severity and corrective action. A failed inspection should create a corrective work order and re-inspection requirement.</div>`,()=>closeModal())}
function evaluatePayment(){toast("Demo evaluation complete: 3 provider certificates prepared for human review")}
function openSchedule(){openModal("Create recurring service schedule",`<div class="formgrid">${sel("Facility type","type",["Public Toilet","Drinking Water","Community Hall","Public Park","All types"])}${sel("Service","service",["Cleaning","Water point inspection","Safety inspection","Preventive maintenance"])}${sel("Frequency","frequency",["Once daily","Twice daily","Four times daily","Weekly","Before each booking"])}${f("Service window","window","e.g. 06:00–08:00")}${sel("Evidence rule","evidence",["Checklist","Checklist + photo","Meter reading + photo"])}${f("Grace period (minutes)","grace","15","number")}</div><div class="notice">The schedule engine creates due tasks and escalations; it does not mark tasks complete automatically.</div>`,()=>{closeModal();toast("Demo: schedule template saved")})}
render();
</script></body></html>
